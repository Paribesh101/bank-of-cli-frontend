<div class="container">
    <h1>TRANSACTION</h1>
    <form #transactionForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="normal-field">
            <select name="type" [(ngModel)]="type">    
                <option value="deposit">Deposit</option>
                <option value="withdraw">Withdraw</option>
                <option value="transfer">Transfer</option>
            </select>
        </div>
        <div class="normal-field">
            <input type="number" name="amount" [(ngModel)]="amount" step="0.01" min="0.00" required>
        </div>
        @if (type === 'transfer') {
            <div class="normal-field">
                <input type="text" name="username" [(ngModel)]="username" placeholder="Username" required>
            </div>
        }
        <div class="large-field">
            <input type="text" name="description" [(ngModel)]="description" placeholder="Description" class="description">
        </div>
        <button type="submit" [disabled]="transactionForm.invalid">Submit</button>
    </form>
</div>
