

<form (ngSubmit)="attemptLogin()" class="login-form">
   <div class="login-selector">
    <button (click)="mode.set('login')" [class.active]="mode() === 'login'">Login</button>
    <button (click)="mode.set('register' )" [class.active]="mode() === 'register'">Register</button>

  </div>
    @if(mode()=='register'){
        <h2>Create new account</h2>
    }
    @if(mode()=='login'){
        <h2>Login to your account</h2>
    }
    <label>
        <p>Username</p>
        <input type="text" [(ngModel)]="usernameInput" name="username" required />
    </label>
    <label>
        <p>Password</p>
        <input type="password" [(ngModel)]="passwordInput" name="password" required />
    </label>
    <button type="submit" class="login-button">Login</button>
    @if (errorMessage) {
        <p class="error-message">{{errorMessage}}</p>
    }
</form>
