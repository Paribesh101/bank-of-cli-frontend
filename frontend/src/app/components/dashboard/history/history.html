<div class="history-container">


  <div class="history-header">

    <h2>Transaction History</h2>

    <mat-form-field
      class="filter-field"
      appearance="outline"
    >
      <mat-label>Search transactions</mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search transactions"
        #input
      >
    </mat-form-field>

  </div>


  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="transaction-table"
    >

      <ng-container matColumnDef="timestamp">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Date
        </th>

        <td
          mat-cell
          *matCellDef="let transaction"
        >

  
          <span class="date-desktop">
            {{ transaction.timestamp }}
          </span>

          <span class="date-mobile">
            {{ transaction.timestamp.substring(0, 10) }}
          </span>

        </td>

      </ng-container>


      <!-- TYPE -->
      <ng-container matColumnDef="type">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Type
        </th>

        <td
          mat-cell
          *matCellDef="let transaction"
          class="type-cell"
        >
          {{ transaction.type }}
        </td>

      </ng-container>


      <!-- AMOUNT -->
      <ng-container matColumnDef="amount">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Amount
        </th>

        <td
          mat-cell
          *matCellDef="let transaction"
          class="amount-cell"
        >
          {{ transaction.amount | currency }}
        </td>

      </ng-container>


      <!-- Header row -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>


      <!-- Transaction rows -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>



      <tr
        class="mat-row"
        *matNoDataRow
      >

        <td
          class="mat-cell no-results"
          [attr.colspan]="displayedColumns.length"
        >
          No transactions matching "{{ input.value }}"
        </td>

      </tr>

    </table>


    
    <mat-paginator
      class="history-paginator"
      [pageSize]="5"
      hidePageSize
    >
    </mat-paginator>

  </div>

</div>
